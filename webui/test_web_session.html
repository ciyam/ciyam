<html lang="en">

<head>
   <meta charset="UTF-8">

   <meta http-equiv="Expires" content="0"/>
   <meta http-equiv="Pragma" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-store"/>

   <script type="text/javascript" src="ciyam.js"></script>

   <script type="text/javascript" src="sha2.min.js"></script>
   <script type="text/javascript" src="bip39.min.js"></script>
   <script type="text/javascript" src="qrcode.min.js"></script>

   <title>Test Web Session</title>

   <style>
   :root
   {
      --radius-pill: 999px;

      --duration-medium: 200ms;

      --color-accent-500: #5b6cf6;
      --color-neutral-200: #f4f4f7;

      --color-bg-subtle: var(--color-neutral-200);
      --color-accent-default: var(--color-accent-500);
   }

   .progress
   {
      height: 10px;
      overflow: hidden;
      background: var(--color-bg-subtle);
      border-radius: var(--radius-pill);
   }

   .progress_bar
   {
      height: 100%;
      background: var(--color-accent-default);
      transition: width var(--duration-medium);
   }
   </style>

</head>

<body onload="load( )">
   <a id="test_href" href=""><h1>Test Web Session</h1></a>

   <div id="test_image" style="left: 34%; margin-top: -50px; position: absolute;"></div>

   <!--
   NOTE: This DIV is used
   for loading the "form"
   content dynamically.
   -->
   <div id="test_content">
   </div>

   <br/>

   <div class="progress">
      <div class="progress_bar" id="progress_bar" style="width: 0%;"></div>
   </div>

   <div id="test_special"></div>

   <script>
   const load_delay = 50;

   var self = 0;
   var owner = 0;

   var started_session = false;
   var is_admin_session = false;

   var load_attempts = 0;
   var max_load_attempts = 100;

   var init_script_value = null;

   var load_script_function = "";

   var include_script_usage_hints = true;

   var ciyam = new CIYAM( window.location.protocol + '//' + window.location.host );

   window.onfocus = function ( )
   {
      if( self )
         populate_access( );
   }

   function clear_storage_and_reload( )
   {
      if( confirm( "Remove all local storage information?" ) )
      {
         localStorage.clear( );

         location.reload( true );
      }
   }

   const test_web_channel = new BroadcastChannel( "test_web_channel" );

   test_web_channel.addEventListener( "message", ( event ) =>
   {
      var data = event.data;

      console.log( "channel message ==> " + data );

      var pos = data.indexOf( ":" );

      if( pos >= 0 )
      {
         var target = data.substr( 0, pos );
         var viewer = data.substr( pos + 1 );

         var is_for_self = false;

         if( self == target )
         {
            is_for_self = true;
            target = "*** self ***";
         }

         console.log( "target = " + target );
         console.log( "viewer = " + viewer );

         if( is_for_self )
         {
            if( started_session )
            {
               test_web_channel.postMessage( viewer + "-" + self );

               if( ciyam.sessid != "" )
                  test_web_channel.postMessage( viewer + "=" + ciyam.access + ","
                   + ciyam.device + "," + ciyam.hashed + "," + ciyam.sessid + "," + ciyam.unique );
            }
         }
      }
      else
      {
         pos = data.indexOf( "-" );

         if( pos >= 0 )
         {
            var viewer = data.substr( 0, pos );
            var shared = data.substr( pos + 1 );

            if( self == viewer )
            {
               owner = shared;

               console.log( "owner = " + owner );

               var href_url = new URL( window.location.href );

               href_url.searchParams.set( "source", owner );

               document.getElementById( "test_href" ).href = href_url;
            }
         }
         else
         {
            pos = data.indexOf( "=" );

            if( pos >= 0 )
            {
               var viewer = data.substr( 0, pos );
               var shared = data.substr( pos + 1 );

               if( !started_session && ( ( self == viewer ) || ( owner == viewer ) ) )
               {
                  var user_data = shared.split( "," );

                  ciyam.access = user_data[ 0 ];
                  ciyam.device = user_data[ 1 ];
                  ciyam.hashed = user_data[ 2 ];
                  ciyam.sessid = user_data[ 3 ];
                  ciyam.unique = user_data[ 4 ];

                  if( link_session != null )
                     link_session( );
               }
            }
            else if( ( data == self ) || ( data == owner ) )
            {
               owner = 0;

               started_session = false;
               is_admin_session = false;

               ciyam.access = "";
               ciyam.device = "";
               ciyam.hashed = "";
               ciyam.sessid = "";
               ciyam.unique = "";

               if( unlink_session != null )
                  unlink_session( );
            }
         }
      }
   } );

   function input_key( event )
   {
      // NOTE: Up arrow sets the value from the placeholder
      // (which acts as a "recall the last request" to then
      // be optionally edited for repeating).
      if( event.keyCode == 38 )
      {
         event.target.value = event.target.placeholder;

         return false;
      }
      else
         return true;
   }

   function word_length_compare( lhs, rhs )
   {
      var pos = lhs.indexOf( " " );

      if( pos > 0 )
         lhs = lhs.substring( 0, pos );

      pos = rhs.indexOf( " " );

      if( pos > 0 )
         rhs = rhs.substring( 0, pos );

      var retval = 0;

      if( lhs.length < rhs.length )
         retval = -1;
      else if( lhs.length > rhs.length )
         retval = 1;
      else
      {
         if( lhs < rhs )
            retval = -1;
         else if( lhs > rhs )
            retval = 1;
      }

      return retval;
   }

   function binary_search( array, item )
   {
      var left = 0;

      var right = array.length - 1;

      while( left <= right )
      {
         const mid = Math.floor( ( left + right ) / 2 );

         if( array[ mid ] == item )
            return true;
         else if( array[ mid ] < item )
            left = mid + 1;
         else
            right = mid - 1;
      }

      return false;
   }

   function script_loaded( value )
   {
      document.getElementById( "user_arbitrary" ).value = value;
   }

   function script_executed( value )
   {
      document.getElementById( "user_arbitrary" ).value = value;
   }

   function call_script_at_load( )
   {
      if( typeof window[ load_script_function ] === "function" )
         eval( load_script_function + "( script_loaded )" );
      else
      {
         if( ++load_attempts > max_load_attempts )
            script_loaded( "(failed to load script)" );
         else
            window.setTimeout( call_script_at_load, load_delay );
      }
   }

   function show_progress( )
   {
      document.getElementById( "progress_bar" ).style.width = "0%";
      document.getElementById( "progress_bar" ).style.display = "";
   }

   function hide_progress( )
   {
      document.getElementById( "progress_bar" ).style.display = "none";
   }

   function update_progress( fraction )
   {
      document.getElementById( "progress_bar" ).style.width = ( fraction * 100 ) + "%";
   }

   function load_js( new_page_script, raw_script_information )
   {
      unload_js( new_page_script );

      if( raw_script_information != null )
      {
         var new_script = document.createElement( "script" );

         new_script.textContent = raw_script_information;

         var pos = raw_script_information.indexOf( "_at_load( )" );

         if( pos > 0 )
         {
            var function_prefix = raw_script_information.substr( 0, pos );

            pos = function_prefix.indexOf( " " );

            if( pos > 0 )
               new_page_script = function_prefix.substring( pos + 1 );
         }

         new_script.setAttribute( "id", new_page_script );

         document.head.appendChild( new_script );
      }
      else if( new_page_script != "" )
      {
         var new_script = document.createElement( "script" );

         new_script.src = new_page_script + ".js?" + Date.now( );

         new_script.setAttribute( "id", new_page_script );

         document.head.appendChild( new_script );
      }

      if( new_page_script != "" )
      {
         load_attempts = 0;

         load_script_function = new_page_script + "_at_load";

         window.setTimeout( call_script_at_load, load_delay );
      }
   }

   function unload_js( page_script )
   {
      const old_page_script = document.getElementById( page_script );

      if( old_page_script != null )
      {
         old_page_script.remove( );

         // NOTE: Cleans up known resources.

         delete window[ page_script + "_result" ];
         window[ page_script + "_result" ] = undefined;

         delete window[ page_script + "_at_load" ];
         window[ page_script + "_at_load" ] = undefined;

         delete window[ page_script + "_execute" ];
         window[ page_script + "_execute" ] = undefined;
      }
   }

   function load_form( new_page_form, raw_form_information )
   {
      const old_page_form = document.getElementById( new_page_form );

      if( old_page_form != null )
         old_page_form.remove( );

      if( raw_form_information != null )
         document.getElementById( "test_content" ).innerHTML = raw_form_information;
      else
      {
         fetch( new_page_form + ".form" )
          .then( response => response.text( ) )
          .then( data => { document.getElementById( "test_content" ).innerHTML = data; } );
      }
   }

   function unload_form( page_form )
   {
      document.getElementById( "test_content" ).innerHTML = "";
   }

   function load_style( new_page_style, raw_style_information )
   {
      const old_page_style = document.getElementById( new_page_style );

      if( old_page_style != null )
         old_page_style.remove( );

      if( raw_style_information != null )
      {
         var new_style = document.createElement( "style" );

         new_style.textContent = raw_style_information;

         new_style.setAttribute( "id", new_page_style );

         document.head.appendChild( new_style );
      }
      else
      {
         var new_link = document.createElement( "link" );

         new_link.rel = "stylesheet";

         // NOTE: A dummy "unique" query string is added so
         // the browser does not use a cached version (this
         // is still required despite the meta cache tags).
         new_link.href = new_page_style + ".css?" + Date.now( );

         new_link.setAttribute( "id", new_page_style );

         document.head.appendChild( new_link );
      }
   }

   function unload_style( page_style )
   {
      const old_page_style = document.getElementById( page_style );

      if( old_page_style != null )
         old_page_style.remove( );
   }

   function load_main_js( new_main_script, source )
   {
      unload_main_js( new_main_script );

      if( new_main_script != "" )
      {
         var new_script = document.createElement( "script" );

         new_script.src = new_main_script + ".js?" + source;

         new_script.setAttribute( "id", new_main_script );

         document.body.appendChild( new_script );
      }

      if( new_main_script != "" )
      {
         load_attempts = 0;

         load_script_function = new_main_script;

         window.setTimeout( call_script_at_load, load_delay );
      }
   }

   function unload_main_js( main_script )
   {
      const old_main_script = document.getElementById( main_script );

      if( old_main_script != null )
         old_main_script.remove( );
   }

   function load( )
   {
      load_form( "test_web_session" );

      setTimeout( load_main, 100 );
   }

   function load_main( )
   {
      self = Date.now( );

      if( sessionStorage.getItem( "self" ) != null )
         self = sessionStorage.getItem( "self" );
      else
         sessionStorage.setItem( "self", self );

      console.log( "self: " + self );

      var href_url = new URL( window.location.href );

      var source = href_url.searchParams.get( "source" );

      if( source == null )
         source = self;

      // NOTE: Ensures that linked tabs can use
      // a cached main js that is loaded by the
      // initial tab (or "source").
      load_main_js( "test_web_session", source );

      setTimeout( load_complete, 100 );
   }

   function load_complete( )
   {
      var href_url = new URL( window.location.href );

      var source = href_url.searchParams.get( "source" );

      if( source != null )
      {
         console.log( "source: " + source );

         test_web_channel.postMessage( source + ':' + self );
      }
      else
      {
         href_url.searchParams.set( "source", self );

         document.getElementById( "test_href" ).href = href_url;
      }
   }
   </script>
</body>

</html>
