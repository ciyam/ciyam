<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <meta http-equiv="Expires" content="0"/>
   <meta http-equiv="Pragma" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-store"/>

   <!-- NOTE: A link in a message opened tells the site nothing of where it came from - the node's address included. -->
   <meta name="referrer" content="no-referrer">

   <title>CIYAM Chat</title>

   <!--
   NOTE: Fonts are self-hosted. Loading them from a font CDN would disclose
   every visitor's IP address to a third party on page load, which is exactly
   what CIYAM exists to avoid. There are no external requests from this page.
   -->
   <link rel="stylesheet" href="fonts.css">

   <link rel="stylesheet" href="tokens.css">
   <link rel="stylesheet" href="chat_tokens.css">
   <link rel="stylesheet" href="chat.css">
   <link rel="stylesheet" href="chat_format.css">
   <link rel="stylesheet" href="signin.css">
   <link rel="stylesheet" href="apps.css">

   <script type="text/javascript" src="ciyam.js"></script>
   <script type="text/javascript" src="sha2.min.js"></script>
   <script type="text/javascript" src="chat_parse.js"></script>
   <script type="text/javascript" src="chat_emoji.js"></script>
   <script type="text/javascript" src="account_parse.js"></script>
   <script type="text/javascript" src="dialog.js"></script>
   <script type="text/javascript" src="signin.js"></script>
   <script type="text/javascript" src="apps.js"></script>
   <script type="text/javascript" src="notify.js"></script>
   <script type="text/javascript" src="qr_scan.js"></script>
   <script type="text/javascript" src="chat_keys.js"></script>
   <script type="text/javascript" src="chat_call.js"></script>
   <script type="text/javascript" src="picker.js"></script>
   <script type="text/javascript" src="when_picker.js"></script>
</head>

<body onload="load( )">
   <!--
   NOTE: This DIV is used for loading the
   "form" content dynamically, matching the
   pattern used by "test_web_session.html".
   -->
   <!-- NOTE: Said while the chat's scripts arrive - on a slow connection some seconds (Ian, 2026-11-11, over 4G) - and gone once
        "chat.js" runs. -->
   <div class="chat-empty" id="chat_page_loading" role="status">Loading the chat…</div>
   <div id="chat_content"></div>

   <script>
   const c_load_delay = 50;

   const c_max_load_attempts = 100;

   const c_channel_name = "test_web_channel";

   var g_self = 0;
   var g_owner = 0;

   var g_load_attempts = 0;

   var ciyam = new CIYAM( window.location.protocol + "//" + window.location.host, false, true );

   const chat_channel = new BroadcastChannel( c_channel_name );

   // NOTE: The shared channel protocol is the one "test_web_session.html" already
   // speaks, so the harness can be embedded unchanged:
   //
   //   "<target>:<viewer>"   viewer asks target for its session
   //   "<viewer>-<owner>"    target names itself as the owner
   //   "<viewer>=<fields>"   target hands over its credentials
   //   "<id>"                session ended - unlink
   //
   // The harness reads the first five credential fields and ignores any extra,
   // so the username and role can be appended for another chat tab to pick up.
   chat_channel.addEventListener( "message", function( event )
   {
      var data = String( event.data );

      var pos = data.indexOf( ":" );

      if( pos >= 0 )
      {
         var target = data.substr( 0, pos );
         var viewer = data.substring( pos + 1 );

         if( ( g_self == target ) && ( ciyam.sessid !== "" ) )
         {
            chat_channel.postMessage( viewer + "-" + g_self );

            chat_channel.postMessage( viewer + "=" + ciyam.access + "," + ciyam.device + ","
             + ciyam.hashed + "," + ciyam.sessid + "," + ciyam.unique + ","
             + encode_channel_field( ciyam.username ) + "," + ( ciyam.is_admin ? "1" : "0" ) );
         }

         return;
      }

      pos = data.indexOf( "-" );

      if( pos >= 0 )
      {
         var viewer = data.substr( 0, pos );

         if( g_self == viewer )
            g_owner = data.substring( pos + 1 );

         return;
      }

      pos = data.indexOf( "=" );

      if( pos >= 0 )
      {
         var viewer = data.substr( 0, pos );

         if( ( g_self == viewer ) && ( ciyam.sessid === "" ) )
            adopt_session( data.substring( pos + 1 ) );

         return;
      }

      if( ( data == g_self ) || ( data == g_owner ) )
      {
         g_owner = 0;

         // NOTE: The link has ended - "source=" goes first, so the reload does not try to link
         // to a page that is no longer signed in.
         if( typeof do_disconnect === "function" )
         {
            forget_source( );

            window.location.reload( );
         }
      }
   } );

   function adopt_session( shared )
   {
      var fields = shared.split( "," );

      if( fields.length < 5 )
         return;

      ciyam.access = fields[ 0 ];
      ciyam.device = fields[ 1 ];
      ciyam.hashed = fields[ 2 ];
      ciyam.sessid = fields[ 3 ];
      ciyam.unique = fields[ 4 ];

      if( fields.length > 5 )
         ciyam.username = decode_channel_field( fields[ 5 ] );

      if( fields.length > 6 )
         ciyam.is_admin = ( fields[ 6 ] === "1" );

      if( typeof enter_chat === "function" )
         enter_chat( );
   }

   // NOTE: No cache keys. The server sends "Cache-Control: no-cache" for ".html", ".form",
   // ".js" and ".css" (Ian, 2026-09-27 - ISS-021), so the browser checks each file every time
   // and an edited one arrives with a plain reload. Before that the chat keyed each file by
   // its "Last-Modified", at the cost of a HEAD request per file.
   function load_form( name )
   {
      return fetch( name + ".form" )
       .then( function( response ) { return response.text( ); } )
       .then( function( data )
       {
          document.getElementById( "chat_content" ).innerHTML = data;
       } );
   }

   // NOTE: Run from the script's own load, however long it takes to arrive (Ian, 2026-11-11: on 4G "chat.js" took longer than the
   // five seconds the page used to wait for it, and "failed to load"); one that could not be loaded is said.
   function load_main_js( name, loaded )
   {
      var script = document.createElement( "script" );

      script.src = name + ".js";

      script.setAttribute( "id", name );

      script.onload = loaded;
      script.onerror = function( ) { load_failed( "(failed to load " + name + ".js - check the connection, then reload)" ); };

      document.body.appendChild( script );
   }

   function load_failed( text )
   {
      document.getElementById( "chat_page_loading" ).hidden = true;
      document.getElementById( "chat_content" ).textContent = text;
   }

   // NOTE: Resolves once the script has run, so the next can rely on it.
   function load_script( file )
   {
      return new Promise( function( resolve )
      {
         var script = document.createElement( "script" );

         script.src = file;

         script.onload = resolve;
         script.onerror = resolve;

         document.body.appendChild( script );
      } );
   }

   function call_at_load( )
   {
      if( typeof window[ "chat" ] === "function" )
      {
         document.getElementById( "chat_page_loading" ).hidden = true;

         chat( );
      }
      else if( ++g_load_attempts <= c_max_load_attempts )
         window.setTimeout( call_at_load, c_load_delay );
      else
         load_failed( "(failed to load chat.js - check the connection, then reload)" );
   }

   // NOTE: The scripts are loaded only once the markup is in place. They used to start 100ms
   // after the markup was requested, whether or not it had arrived - and a "chat.js" served
   // from the browser's memory cache could then run first. The sign in (then "populate_accounts( )")
   // found no select and threw, so the saved accounts vanished: Ian saw it in Firefox after F5, and
   // only restarting Firefox, which empties that cache, brought them back.
   function load( )
   {
      load_form( "chat" )
       .then( load_main )
       .catch( function( )
       {
          load_failed( "(failed to load chat.form - check the connection, then reload)" );
       } );
   }

   function load_main( )
   {
      g_self = Date.now( );

      // NOTE: A chat takes a fresh id each time it is opened, and keeps it only through a reload or
      // "Back" - so the consoles and pages linked to it stay linked. The browser copies
      // "sessionStorage" into a tab opened from another, so it would otherwise share the opener's
      // id, and two pages with one id both answer a console asking for its session. Since the apps
      // open each other in the same tab (2026-10-09) that holds without "?source=" too: a chat
      // switched to in a tab opened from another chat had that chat's id (found by review).
      var entries = ( typeof performance !== "undefined" ) && performance.getEntriesByType
       ? performance.getEntriesByType( "navigation" ) : [ ];

      var first_load = ( entries.length === 0 ) || ( entries[ 0 ].type === "navigate" );

      if( !first_load && ( sessionStorage.getItem( "self" ) !== null ) )
         g_self = sessionStorage.getItem( "self" );

      sessionStorage.setItem( "self", g_self );

      // NOTE: "chat.js" calls into "console_parse.js" as soon as it starts, so that is loaded
      // first.
      load_script( "console_parse.js" ).then( function( )
      {
         load_main_js( "chat", call_at_load );
      } );

      window.setTimeout( load_complete, 200 );
   }

   function load_complete( )
   {
      var href = new URL( window.location.href );

      var source = href.searchParams.get( "source" );

      // NOTE: Announce to the opener so that a live session can be shared.
      if( source !== null )
         chat_channel.postMessage( source + ":" + g_self );
   }
   </script>
</body>

</html>
