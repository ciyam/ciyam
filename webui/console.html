<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <meta http-equiv="Expires" content="0"/>
   <meta http-equiv="Pragma" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-store"/>

   <title>CIYAM Console</title>

   <!--
   NOTE: Fonts are self-hosted, as for the chat. There are no external
   requests from this page.
   -->
   <link rel="stylesheet" href="fonts.css">

   <link rel="stylesheet" href="tokens.css">
   <link rel="stylesheet" href="chat_tokens.css">

   <!--
   NOTE: The node's sign in is shared by every app ("signin.js", 2026-10-08) and drawn by "chat.css" and
   "signin.css". "console.css" is loaded after them, below, so the console proper looks as it did.
   -->
   <link rel="stylesheet" href="chat.css">
   <link rel="stylesheet" href="signin.css">
   <link rel="stylesheet" href="apps.css">

   <script type="text/javascript" src="ciyam.js"></script>
   <script type="text/javascript" src="sha2.min.js"></script>
   <script type="text/javascript" src="chat_parse.js"></script>
   <script type="text/javascript" src="account_parse.js"></script>
   <script type="text/javascript" src="signin.js"></script>
   <script type="text/javascript" src="apps.js"></script>

   <!--
   NOTE: The server sends "Cache-Control: no-cache" for ".html", ".form", ".js" and ".css"
   (Ian, 2026-09-27 - ISS-021), so the browser checks each file every time and an edited one
   arrives with a plain reload. The console's files are still loaded below, in order, so the
   markup is in place before the scripts run.
   -->
</head>

<body onload="load( )">
   <div id="console_content"></div>

   <script>
   const c_load_delay = 50;

   const c_max_load_attempts = 100;

   var g_load_attempts = 0;

   var ciyam = new CIYAM( window.location.protocol + "//" + window.location.host, false, true );

   function load_form( name )
   {
      return fetch( name + ".form" )
       .then( function( response ) { return response.text( ); } )
       .then( function( data )
       {
          document.getElementById( "console_content" ).innerHTML = data;
       } );
   }

   function load_style( file )
   {
      var link = document.createElement( "link" );

      link.rel = "stylesheet";
      link.href = file;

      document.head.appendChild( link );

      return Promise.resolve( );
   }

   // NOTE: Resolves once the script has run, so the next can rely on it.
   function load_script( file )
   {
      return new Promise( function( resolve )
      {
         var script = document.createElement( "script" );

         script.src = file;

         script.onload = resolve;
         script.onerror = resolve;

         document.body.appendChild( script );
      } );
   }

   function call_at_load( )
   {
      if( typeof window[ "console_main" ] === "function" )
         console_main( );
      else if( ++g_load_attempts <= c_max_load_attempts )
         window.setTimeout( call_at_load, c_load_delay );
      else
         document.getElementById( "console_content" ).textContent = "(failed to load console.js)";
   }

   // NOTE: The markup is in place before the script is appended, so "console_main( )" never
   // runs against an empty page.
   function load( )
   {
      Promise.all( [ load_style( "console.css" ), load_form( "console" ) ] )
       .then( function( ) { return load_script( "console_parse.js" ); } )
       .then( function( ) { return load_script( "console.js" ); } )
       .then( function( ) { window.setTimeout( call_at_load, c_load_delay ); } );
   }
   </script>
</body>

</html>
