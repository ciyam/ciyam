<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <meta http-equiv="Expires" content="0"/>
   <meta http-equiv="Pragma" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-cache"/>
   <meta http-equiv="Cache-Control" content="no-store"/>

   <title>CIYAM Console</title>

   <!--
   NOTE: Fonts are self-hosted, as for the chat. There are no external
   requests from this page.
   -->
   <link rel="stylesheet" href="fonts.css">

   <link rel="stylesheet" href="tokens.css">
   <link rel="stylesheet" href="chat_tokens.css">

   <script type="text/javascript" src="ciyam.js"></script>
   <script type="text/javascript" src="sha2.min.js"></script>
   <script type="text/javascript" src="chat_parse.js"></script>

   <!--
   NOTE: "console.css", "console_parse.js" and "console.js" change often, and the server
   sends only "Last-Modified" - so a plain tag let the browser keep an old copy. They are
   loaded below with that date as a query string instead.
   -->
</head>

<body onload="load( )">
   <div id="console_content"></div>

   <script>
   const c_load_delay = 50;

   const c_max_load_attempts = 100;

   var g_load_attempts = 0;

   var ciyam = new CIYAM( window.location.protocol + "//" + window.location.host, false, true );

   function load_form( name )
   {
      return fetch( name + ".form?" + Date.now( ) )
       .then( function( response ) { return response.text( ); } )
       .then( function( data )
       {
          document.getElementById( "console_content" ).innerHTML = data;
       } );
   }

   // NOTE: Keyed by the file's own "Last-Modified", as "chat.html" does and for the same
   // reasons - see "load_main_js( )" there.
   function version_of( file )
   {
      return fetch( file, { method: "HEAD" } )
       .then( function( response )
       {
          return response.headers.get( "Last-Modified" ) || String( Date.now( ) );
       } )
       .catch( function( ) { return String( Date.now( ) ); } );
   }

   function load_style( file )
   {
      return version_of( file ).then( function( key )
      {
         var link = document.createElement( "link" );

         link.rel = "stylesheet";
         link.href = file + "?" + encodeURIComponent( key );

         document.head.appendChild( link );
      } );
   }

   // NOTE: Resolves once the script has run, so the next can rely on it.
   function load_script( file )
   {
      return version_of( file ).then( function( key )
      {
         return new Promise( function( resolve )
         {
            var script = document.createElement( "script" );

            script.src = file + "?" + encodeURIComponent( key );

            script.onload = resolve;
            script.onerror = resolve;

            document.body.appendChild( script );
         } );
      } );
   }

   function call_at_load( )
   {
      if( typeof window[ "console_main" ] === "function" )
         console_main( );
      else if( ++g_load_attempts <= c_max_load_attempts )
         window.setTimeout( call_at_load, c_load_delay );
      else
         document.getElementById( "console_content" ).textContent = "(failed to load console.js)";
   }

   // NOTE: The markup is in place before the script is appended, so "console_main( )" never
   // runs against an empty page.
   function load( )
   {
      Promise.all( [ load_style( "console.css" ), load_form( "console" ) ] )
       .then( function( ) { return load_script( "console_parse.js" ); } )
       .then( function( ) { return load_script( "console.js" ); } )
       .then( function( ) { window.setTimeout( call_at_load, c_load_delay ); } );
   }
   </script>
</body>

</html>
