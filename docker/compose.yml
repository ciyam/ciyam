# NOTE: Run from the repository root:
#   docker compose -f docker/compose.yml up --build

services:
  ciyam:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ciyam-server
    container_name: ciyam-server
    ports:
      - "13031:13031"
      - "12021:12021"
    stop_grace_period: 20s
